[package]
name = "dgfl-native"
version = "0.2.0"
edition = "2021"

[lib]
name = "dgfl_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.5", features = ["extension-module"] }
ark-bls12-381 = "0.4.0"
ark-serialize = "0.4.0"
ark-ec = { version = "0.4.0", features = ["parallel"] }
ark-ff = { version = "0.4.0", features = ["asm", "parallel"] }
ark-poly = { version = "0.4.0", features = ["parallel"] }
ark-relations = "0.4.0"
ark-r1cs-std = "0.4.0"
ark-std = { version = "0.4.0", features = ["parallel"] }
# Keep Circom, aggregation, and Wasmer out of this small arithmetic backend.
# Lego's std/parallel features activate Wasmer; underlying Ark MSMs/FFTs are
# instead parallelized inside our bounded Rayon pool.
legogroth16 = { version = "=0.18.0", default-features = false }
rand = "0.8.5"
rayon = "1"
hex = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
